<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Alejandro Martin">
    <title>TAREA 11</title>
</head>

<body>
    <h1>APLICATIVO PARA TRABAJAR EN AMAZON</h1>
    <form action="#" method="get">
        <fieldset>
            <legend><b>DATOS PERSONALES</b></legend>
            <br>
            <label for="nombre">Nombre:</label>
            <input type="text" name="nombre" id="nombre">
            <label for="password">Contraseña:</label>
            <input type="password" name="password" id="Contraseña">
            <br><br>
            <label for="telefono">Tlf.Móvil:</label>
            <input type="tel" name="telefono" id="telefono">
            <label for="dni">DNI:</label>
            <input type="text" name="dni" id="dni">
            <br><br>
            <label for="calle">Calle:</label>
            <input type="text" name="calle" id="calle">
            <label for="provincias">Provincias:</label>
            <select name="provincias" id="provincias">
                <option value="sevilla">Sevilla</option>
                <option value="granada">Granada</option>
                <option value="huelva">Huelva</option>
            </select>
        </fieldset>
        <br><br><br>
        <fieldset>
            <legend><b>EXPERIENCIA LABORAL</b></legend>
            <textarea name="experiencia" id="experiencia" cols="30" rows="10"></textarea>
        </fieldset>
        <button type="submit">Enviar</button>
    </form>
</body>


</html>
